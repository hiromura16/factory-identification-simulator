# Python対象バージョン・依存関係・テスト探索条件。インストール時はuv.lockと合わせて使う。
[project]
name = "factory-identification-simulator"
version = "0.3.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "cryptography>=46,<50",
    "pillow>=12,<14",
    "paho-mqtt>=2.1,<3",
    "qrcode[pil]>=8,<9",
    "python-barcode>=0.15,<0.17",
]
[dependency-groups]
dev = ["httpx==0.28.1","pytest==8.4.2"]
[tool.pytest.ini_options]
pythonpath=["."]
testpaths=["tests"]
